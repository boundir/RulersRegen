        (Stat=eStat_ArmorMitigation, SetPercentMax=true, PercentMax=1, SetPerEncounterValue=true, PerEncounterValue=1, SetOvercap=true), \\
        (Stat=eStat_Offense, SetFlatBonus=true, FlatBonus=5, SetOvercap=true), \\
