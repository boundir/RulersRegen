[RulersRegen.X2EventListener_OverrideRulerHealth]
; This is a fallback to apply to each Rulers not configured below.
+RulerRuleSets=( \\
    RulerTemplateName="", \\
    Rules=( \\
        (Stat=eStat_HP, SetPercentMax=true, PercentMax=0.33), \\
        (Stat=eStat_ArmorMitigation, SetPercentMax=true, PercentMax=1) \\
    ) \\
)

; Specific rules applied to each Rulers individually. If none set we use the fallback above.

; RulerRuleSets takes a RulerTemplateName and can take one or multiple Rules.
; Rules have the following parameters:
; - Stat - See allowed stats below
; - SetPercentMax (boolean) - Set to true if you want to set stat based on max value.
; - SetPercentCurrent (boolean) - Set to true if you want to set stat based on current value.
; - SetFlatBonus (boolean) - Set to true if you want to add a flat bonus to the current value.
; - SetPerEncounterValue (boolean) - Set to true if you want to set additional value based on number of encounters with this Ruler.
; - PercentMax (decimal)
; - PercentCurrent (decimal)
; - FlatBonus (integer)
; - PerEncounterValue (decimal)
; - SetOvercap (boolean) - Allow to go above current max stat value

; Allowed stats:
; - eStat_HP
; - eStat_Offense
; - eStat_Defense
; - eStat_Mobility
; - eStat_Will
; - eStat_SightRadius
; - eStat_Dodge
; - eStat_ArmorMitigation
; - eStat_ArmorPiercing
; - eStat_PsiOffense
; - eStat_DetectionRadius
; - eStat_CritChance
; - eStat_Strength
; - eStat_FlankingCritChance
; - eStat_ShieldHP
; - eStat_FlankingAimBonus

+RulerRuleSets=( \\
    RulerTemplateName="ViperKing", \\
    Rules=( \\
        (Stat=eStat_HP, SetPercentMax=true, PercentMax=0.33, SetPerEncounterValue=true, PerEncounterValue=5, SetOvercap=true), \\
        (Stat=eStat_ArmorMitigation, SetPercentMax=true, PercentMax=1, SetPerEncounterValue=true, PerEncounterValue=2, SetOvercap=true), \\
        (Stat=eStat_Offense, SetFlatBonus=true, FlatBonus=5, SetOvercap=true), \\
        (Stat=eStat_Defense, SetFlatBonus=true, FlatBonus=5, SetOvercap=true) \\
    ) \\
)

